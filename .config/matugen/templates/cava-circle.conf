# Generated by matugen - circular cava visualizer on the desktop background
# ~/.local/bin/cava-colors rewrites the gradient colors (picked from the
# wallpaper behind the ring).
[general]
framerate = 60
bars = 72
bar_width = 3
bar_spacing = 2
sensitivity = 200
autosens = 2

[input]
method = pipewire
source = auto

[output]
method = sdl_glsl
channels = mono
mono_option = average
# Same center as before (960, 351); the surface is bigger to leave room for the glow.
sdl_width = 480
sdl_height = 480
sdl_x = 720
sdl_y = 111
vertex_shader = pass_through.vert
fragment_shader = prism_ring.frag
# Old look: fragment_shader = orion_saturn_subring_transparent.frag with
# bars = 96, bar_width = 1, bar_spacing = 0, sdl 390x390 at x 765, y 156.
continuous_rendering = 1

[color]
background = '{{colors.surface.default.hex}}'
foreground = '{{colors.primary.default.hex}}'
gradient = 1
gradient_color_1 = '{{colors.inverse_primary.default.hex}}'
gradient_color_2 = '{{colors.primary.default.hex}}'
gradient_color_3 = '{{colors.secondary.default.hex}}'

[smoothing]
noise_reduction = 0
waves = 0

[eq]
# treble boost so spikes go all the way around, not just at the bass end
1 = 0.7
2 = 1.0
3 = 1.4
4 = 1.8
5 = 2.2
