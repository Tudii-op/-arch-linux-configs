# Generated by matugen - cava visualizer for the desktop background
[general]
framerate = 60
center_align = 1
bars = 100
bar_width = 5
bar_spacing = 1
sensitivity = 200
autosens = 0

[input]
method = pipewire
source = auto

[output]
method = noncurses
channels = stereo
reverse = 1
orientation = bottom
xaxis = frequency

[color]
background = default
gradient = 1
gradient_color_1 = '{{colors.inverse_primary.default.hex}}'
gradient_color_2 = '{{colors.primary.default.hex}}'
gradient_color_3 = '{{colors.secondary.default.hex}}'

[smoothing]
noise_reduction = 0
waves = 0
