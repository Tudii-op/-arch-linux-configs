# Generated by matugen - mirrored bars on both sides of the circle (cava-gl).
# ~/.local/bin/cava-colors rewrites the gradient colors (picked from the
# wallpaper behind the wings) and the sdl_* size/position (centered on the
# circle). Started and stopped together with the circle by cava-circle.
[general]
framerate = 60
bars = 96
bar_width = 1
bar_spacing = 1
sensitivity = 150
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = sdl_glsl
channels = mono
mono_option = average
sdl_width = 1920
sdl_height = 200
sdl_x = 0
sdl_y = 251
vertex_shader = pass_through.vert
fragment_shader = mirror_wings.frag
continuous_rendering = 1

[color]
background = '#121318'
foreground = '#bac3ff'
gradient = 1
gradient_color_1 = '#6f6ad4'
gradient_color_2 = '#7a8ddf'
gradient_color_3 = '#6fa4f3'
gradient_color_4 = '#68bff8'
gradient_color_5 = '#4ccef9'
gradient_color_6 = '#7f91da'
gradient_color_7 = '#7265d9'

[smoothing]
noise_reduction = 10
waves = 0

[eq]
# treble boost so the outer (high) end of each wing moves too
1 = 0.8
2 = 1.0
3 = 1.3
4 = 1.6
5 = 1.9
