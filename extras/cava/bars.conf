# Generated by matugen - glowing bars on the desktop background (cava-gl).
# ~/.local/bin/cava-colors rewrites the gradient colors (picked from the
# wallpaper behind the bars) and the sdl_* size/position (from the monitor).
[general]
framerate = 60
bars = 120
bar_width = 2
bar_spacing = 1
sensitivity = 100
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = sdl_glsl
channels = stereo
reverse = 1
sdl_width = 1920
sdl_height = 378
sdl_x = 0
sdl_y = 702
vertex_shader = pass_through.vert
fragment_shader = glow_bars.frag
continuous_rendering = 1

[color]
background = '#121318'
foreground = '#bac3ff'
gradient = 1
gradient_color_1 = '#6f6bd4'
gradient_color_2 = '#5fb2fa'
gradient_color_3 = '#637bef'
gradient_color_4 = '#6271e5'
gradient_color_5 = '#6098f4'
gradient_color_6 = '#575df6'
gradient_color_7 = '#865ddf'

[smoothing]
noise_reduction = 10
waves = 0

[eq]
# gentle treble boost so the highs move too, not just the bass
1 = 0.9
2 = 1.0
3 = 1.15
4 = 1.3
5 = 1.45
