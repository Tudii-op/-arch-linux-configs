# Generated by matugen - circular cava visualizer on the desktop background
[general]
framerate = 60
bars = 96
bar_width = 1
bar_spacing = 0
sensitivity = 200
autosens = 2

[input]
method = pipewire
source = auto

[output]
method = sdl_glsl
channels = mono
mono_option = average
sdl_width = 390
sdl_height = 390
sdl_x = 765
sdl_y = 156
vertex_shader = pass_through.vert
fragment_shader = orion_saturn_subring_transparent.frag
continuous_rendering = 1

[color]
background = '#121318'
foreground = '#bac3ff'
gradient = 1
gradient_color_1 = '#515b92'
gradient_color_2 = '#bac3ff'
gradient_color_3 = '#c3c5dd'

[smoothing]
noise_reduction = 0
waves = 0
